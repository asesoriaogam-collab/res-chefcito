apply plugin: 'com.android.application'

android {
    compileSdkVersion 29

    defaultConfig {
        applicationId "com.curse.rat"
        minSdkVersion 21
        targetSdkVersion 29
        versionCode 1
        versionName "1.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    packagingOptions {
        exclude 'res/interpolator/btn_checkbox_checked_mtrl_animation_interpolator_0.xml'
        exclude 'res/interpolator/btn_checkbox_checked_mtrl_animation_interpolator_1.xml'
        exclude 'res/interpolator/btn_checkbox_unchecked_mtrl_animation_interpolator_0.xml'
        exclude 'res/interpolator/btn_checkbox_unchecked_mtrl_animation_interpolator_1.xml'
        exclude 'res/interpolator/btn_radio_checked_mtrl_animation_interpolator_0.xml'
        exclude 'res/interpolator/btn_radio_checked_mtrl_animation_interpolator_1.xml'
        exclude 'res/interpolator/btn_radio_unchecked_mtrl_animation_interpolator_0.xml'
        exclude 'res/interpolator/btn_radio_unchecked_mtrl_animation_interpolator_1.xml'
        exclude 'res/interpolator/fast_out_slow_in.xml'
        exclude 'res/interpolator/mtrl_fast_out_linear_in.xml'
        exclude 'res/interpolator/mtrl_fast_out_slow_in.xml'
        exclude 'res/interpolator/mtrl_linear_out_slow_in.xml'
        exclude 'META-INF/DEPENDENCIES'
        exclude 'META-INF/LICENSE'
        exclude 'META-INF/LICENSE.txt'
        exclude 'META-INF/NOTICE'
        exclude 'META-INF/NOTICE.txt'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.2.0'
    implementation 'androidx.constraintlayout:constraintlayout:1.1.3'
}